[package]
name = "kleinanzeigen-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Unofficial, browser-free CLI for Kleinanzeigen"
license = "MIT"
repository = "https://github.com/fleischerdesign/kleinanzeigen-cli"
homepage = "https://github.com/fleischerdesign/kleinanzeigen-cli"
readme = "README.md"
keywords = ["kleinanzeigen", "classifieds", "cli", "agent"]
categories = ["command-line-utilities"]

[[bin]]
name = "kleinanzeigen"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
